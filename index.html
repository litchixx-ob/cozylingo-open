<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CozyLingo Open · 英语词库与今日小课</title>
<link rel="stylesheet" href="src/app.css">
<link rel="stylesheet" href="src/orchard.css">
</head>
<body>
<header>
  <h1>CozyLingo Open</h1>
  <div class="sub" id="meta">加载中…</div>
  <nav id="tabs"></nav>
</header>

<div class="bar" id="filters">
  <input id="q" type="search" placeholder="搜单词或中文释义…" autocomplete="off">
  <select id="lib"><option value="">全部词书</option></select>
  <select id="topic"><option value="">全部话题</option></select>
  <span class="count" id="count"></span>
</div>

<main>
  <section id="view-browse"><div class="grid" id="grid"></div></section>

  <section id="view-today" hidden>
    <div id="today-head"></div>
    <div id="today-body"></div>
  </section>

  <section id="view-star" hidden>
    <div id="star-host"></div>
    <p class="muted small" style="text-align:center;margin-top:10px">
      12,594 个词按「话题 = 方位、词频 = 海拔」铺成一座山。拖动旋转、滚轮缩放，点按星星查看单词；
      学过的词会点亮，掌握的词变成金色。进度来自你本机的学习记录。
    </p>
  </section>
</main>

<dialog id="dlg"><div class="dbody" id="dbody"></div></dialog>

<footer>
  数据授权 <a href="CONTENT_LICENSE.md">CC BY 4.0</a> · 词头/音标/释义/例句来自
  <a href="https://github.com/kylebing/english-vocabulary">kylebing/english-vocabulary</a>（BSD-3-Clause）·
  记忆法/话题/词频/插画为 CozyLingo 原创 · 复习调度用 <a href="docs/fsrs.md">FSRS</a>
</footer>

<!-- fsrs.js 与服务端逐字相同，是 CommonJS 模块；用下面两行 shim 加载 -->
<script>window.module = { exports: {} };</script>
<script src="src/fsrs.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
